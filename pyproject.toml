[project]
name = "lidar-avoidance-ml"
version = "0.1.0"
description = "2D LiDAR Obstacle Avoidance Imitation Learning Pipeline (Collect -> Train -> Test)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "openvino>=2024.6.0",
    "pillow>=9.2.0",
    "pygame>=2.6.0",
    "scikit-learn>=1.5.0",
    "torch>=2.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
